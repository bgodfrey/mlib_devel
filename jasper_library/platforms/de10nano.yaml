name: de10nano
manufacturer: Intel
fpga: 5CSEBA6U23I7
family: "Cyclone 5"
config_voltage: 3.3
backend_target: quartus
mmbus_architecture: AXI4-Lite
mmbus_base_address: 0xC0000000
mmbus_address_alignment: 4
constraints:
  - de10nano.qsf
provides:
  - FPGA_CLK1_50
  - FPGA_CLK2_50
  - FPGA_CLK3_50
pins:
  FPGA_CLK1_50:
    io_std:"3.3-V LVTTL"
    loc:
      - PIN_V11
  FPGA_CLK2_50:
    io_std:"3.3-V LVTTL"
    loc:
      - PIN_Y13
  FPGA_CLK3_50:
    io_std:"3.3-V LVTTL"
    loc:
      - PIN_E11
  LED:
    io_std "3.3-V LVTTL"
    loc:
      - PIN_AA23
      - PIN_Y16
      - PIN_AE26
      - PIN_AF26
      - PIN_V15
      - PIN_V16
      - PIN_AA24
      - PIN_W15
  SW:
    io_std:3.3-V LVTTL
    loc:
      - PIN_Y24
      - PIN_W24
      - PIN_W21
      - PIN_W20

